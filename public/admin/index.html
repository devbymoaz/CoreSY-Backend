<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoreSY Admin</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 720px;
        margin: 48px auto;
        padding: 0 20px;
        line-height: 1.6;
        color: #1f2937;
      }
      code {
        background: #f3f4f6;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .box {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 16px;
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <h1>CoreSY Admin Panel</h1>
    <p>Backend is running, but the admin frontend build has not been uploaded yet.</p>
    <div class="box">
      <p><strong>Upload your admin build to:</strong> <code>public/admin/</code></p>
      <p>After upload, restart Node and open <code>/admin</code> again.</p>
      <p>API docs: <a href="/api-docs">/api-docs</a></p>
      <p>Health check: <a href="/api/v1/health">/api/v1/health</a></p>
    </div>
  </body>
</html>
